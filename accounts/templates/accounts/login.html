{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">Вход</h2>
            <form method="post">
                {% csrf_token %}
                <input type="text" name="username" class="form-control mb-3" placeholder="Имя пользователя" required>
                <input type="password" name="password" class="form-control mb-4" placeholder="Пароль" required>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <div class="text-center mt-4">
                <a href="{% url 'accounts:register' %}">Нет аккаунта? Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
