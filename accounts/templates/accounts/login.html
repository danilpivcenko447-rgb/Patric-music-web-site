{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="glass-card p-4">
            <h2 class="text-center mb-4">Вход</h2>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Имя пользователя" required style="background: rgba(255,255,255,0.1); border: none; color: white;">
                </div>
                <div class="mb-4">
                    <input type="password" name="password" class="form-control" placeholder="Пароль" required style="background: rgba(255,255,255,0.1); border: none; color: white;">
                </div>
                <button type="submit" class="btn-glass w-100">Войти</button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-white-50">Нет аккаунта? <a href="{% url 'accounts:register' %}" style="color: #a8b2ff;">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
