{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">Регистрация</h2>
            <form method="post">
                {% csrf_token %}
                <input type="text" name="username" class="form-control mb-3" placeholder="Имя пользователя" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Пароль (мин. 6)" required>
                <input type="password" name="password2" class="form-control mb-4" placeholder="Подтвердите пароль" required>
                <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>
            <div class="text-center mt-4">
                <a href="{% url 'accounts:login' %}">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
