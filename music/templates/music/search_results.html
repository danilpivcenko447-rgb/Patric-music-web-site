{% extends 'base.html' %}

{% block content %}
<h1 class="text-center mb-4">Поиск треков</h1>

<form method="get" class="d-flex justify-content-center mb-4">
    <input type="text" name="q" class="form-control w-50 me-2" placeholder="Название трека или исполнитель" value="{{ query }}">
    <button type="submit" class="btn-glass">Искать</button>
</form>
<div class="row">
    {% for track in tracks %}
    <div class="col-md-6 mb-3">
        <div class="glass-card p-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ track.title }}</strong><br>
                    <small>{{ track.album.artist }} — {{ track.album.title }}</small>
                </div>
                <audio controls style="height: 35px;">
                    <source src="{{ track.audio.url }}" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>
    {% empty %}
        {% if query %}
            <p class="text-center">Ничего не найдено</p>
        {% endif %}
    {% endfor %}
</div>
{% endblock %}
