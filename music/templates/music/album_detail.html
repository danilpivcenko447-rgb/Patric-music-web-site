{% extends 'base.html' %}

{% block content %}
<h1>{{ album.title }}</h1>
<h4 class="text-white-50 mb-3">{{ album.artist }}</h4>

{% for track in tracks %}
<div class="card mb-2">
    <div class="row">
        <div class="col-md-4">
            <strong>{{ forloop.counter }}. {{ track.title }}</strong>
        </div>
        <div class="col-md-5">
            <audio controls class="w-100">
                <source src="{{ track.audio.url }}" type="audio/mpeg">
            </audio>
        </div>
        <div class="col-md-3 text-end">
            <form method="post" action="{% if track.id in user_track_ids %}{% url 'music:remove_from_library' track.id %}{% else %}{% url 'music:add_to_library' track.id %}{% endif %}">
                {% csrf_token %}
                <button class="btn {% if track.id in user_track_ids %}btn-danger{% else %}btn-success{% endif %} btn-sm">
                    {% if track.id in user_track_ids %}Убрать{% else %}В библиотеку{% endif %}
                </button>
            </form>
        </div>
    </div>
</div>
{% endfor %}

<a href="{% url 'music:album_list' %}" class="btn btn-secondary mt-3">Назад</a>
{% endblock %}
