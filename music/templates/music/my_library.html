{% extends 'base.html' %}

{% block content %}
<h1 class="text-center mb-4">Моя библиотека</h1>

{% if user_tracks %}
    {% for item in user_tracks %}
    <div class="card mb-2">
        <div class="row">
            <div class="col-md-4">
                <strong>{{ item.track.title }}</strong><br>
                <small class="text-white-50">{{ item.track.album.artist }}</small>
            </div>
            <div class="col-md-5">
                <audio controls class="w-100">
                    <source src="{{ item.track.audio.url }}" type="audio/mpeg">
                </audio>
            </div>
            <div class="col-md-3 text-end">
                <form method="post" action="{% url 'music:remove_from_library' item.track.id %}">
                    {% csrf_token %}
                    <button class="btn btn-danger btn-sm">Убрать</button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
{% else %}
    <div class="card text-center p-4">
        <p>У вас пока нет треков</p>
        <a href="{% url 'music:album_list' %}" class="btn btn-primary">Найти музыку</a>
    </div>
{% endif %}
{% endblock %}
